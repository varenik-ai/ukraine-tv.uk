      padding:11px 22px;border-radius:24px;font-size:14px;font-weight:700;text-decoration:none;transition:.2s;margin-bottom:8px}
    .tg-overlay-btn:hover{background:#1a8dc5}
    .tg-overlay-skip{display:block;font-size:12px;color:rgba(255,255,255,.35);cursor:pointer;margin-top:8px;transition:.2s}
    .tg-overlay-skip:hover{color:rgba(255,255,255,.65)}
    
const PROXY = 'https://ukraine-worker.dyaltd.workers.dev';
const ch_id = 'nikikids';
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const status = document.getElementById('status');
const tgOverlay = document.getElementById('tg-overlay');
const overlaySkip = document.getElementById('overlay-skip');
let hls = null, overlayTimer = null;


  return false;
}

function setStatus(msg) { status.textContent = msg; }

function startStream() {
  overlay.style.display = 'none';
  setStatus('⏳ Підключення...');
  if (typeof Hls === 'undefined') { setTimeout(startStream, 300); return; }
  const url = PROXY + '/stream?channel=' + ch_id;
  if (Hls.isSupported()) {
    hls = new Hls({liveSyncDurationCount:3,lowLatencyMode:false,enableWorker:false});
    hls.loadSource(url);
    hls.attachMedia(video);
    video.muted = true; video.volume = 1; video.play().catch(function() {});
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      video.muted = true; video.play().catch(()=>{});
      setStatus('▶ Трансляція запущена');
      setTimeout(() => { showPreroll(() => { scheduleOverlay(); }); }, 120000);
    });
    hls.on(Hls.Events.ERROR, (e, d) => {
      if (d.fatal) setStatus('❌ Помилка трансляції — спробуйте пізніше');
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.muted = true; video.play().catch(()=>{});
    setStatus('▶ Трансляція запущена');
    setTimeout(() => { showPreroll(() => { scheduleOverlay(); }); }, 120000);
  }
}

// Pre-roll: показується перед першим запуском потоку
const prerollOverlay = document.getElementById('preroll-overlay');
const prerollSkip = document.getElementById('preroll-skip');
const prerollCount = document.getElementById('preroll-count');
let _prerollShown = false;

function showPreroll(callback) {
  if (_prerollShown) { callback(); return; }
  _prerollShown = true;
  video.pause();
  prerollOverlay.classList.add('show');
  let sec = 8;
  const tick = setInterval(() => {
    sec--;
    if (prerollCount) prerollCount.textContent = sec;
    if (sec <= 0) {
      clearInterval(tick);
      if (prerollSkip) {
        prerollSkip.textContent = '▶ Дивитися зараз';
        prerollSkip.classList.add('ready');
      }
    }
  }, 1000);
  // Після 5 сек кнопка стає активною (клікабельною)
  setTimeout(() => {
    if (prerollSkip) prerollSkip.classList.add('ready');
  }, 5000);
  // Автозакриття після 8 сек
  const autoTimer = setTimeout(() => {
    prerollOverlay.classList.remove('show');
    video.play().catch(()=>{});
    callback();
  }, 8000);
  if (prerollSkip) {
    prerollSkip.addEventListener('click', function handler() {
      if (!prerollSkip.classList.contains('ready')) return;
      clearInterval(tick);
      clearTimeout(autoTimer);
      prerollOverlay.classList.remove('show');
      prerollSkip.removeEventListener('click', handler);
      video.play().catch(()=>{});
      callback();
    });
  }
}

overlay.addEventListener('click', () => startStream());

// Telegram overlay — макс. 2 рази за завантаження сторінки, пауза відео
let _overlayCount = 0;

overlaySkip.addEventListener('click', () => {
  tgOverlay.classList.remove('show');
  clearTimeout(overlayTimer);
  video.play().catch(()=>{});
});

function scheduleOverlay() {
  clearTimeout(overlayTimer);
  tgOverlay.classList.remove('show');
  if (_overlayCount < 2) {
    overlayTimer = setTimeout(() => {
      tgOverlay.classList.add('show');
      _overlayCount++;
      video.pause();
    }, 120000);
  }
}

// Fullscreen через кастомну кнопку — розгортаємо player-wrap, а не <video>
const _playerWrap = document.getElementById('player-wrap');
const fsBtn = document.getElementById('fs-btn');

fsBtn.addEventListener('click', function() {
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  if (fsEl) {
    // Вихід з fullscreen
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  } else {
    // Вхід у fullscreen: спочатку player-wrap, fallback — нативний <video> (iOS)
    if (_playerWrap.requestFullscreen) {
      _playerWrap.requestFullscreen().catch(()=>{});
    } else if (_playerWrap.webkitRequestFullscreen) {
      _playerWrap.webkitRequestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      // iOS Safari: тільки <video> підтримує fullscreen
      video.webkitEnterFullscreen();
    }
  }
});

function _onFsUpdate() {
  const inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
  fsBtn.textContent = inFs ? '✕' : '⛶';
  if (inFs) scheduleOverlay();
}
document.addEventListener('fullscreenchange', _onFsUpdate);
document.addEventListener('webkitfullscreenchange', _onFsUpdate);
// iOS webkitbeginfullscreen на video
video.addEventListener('webkitbeginfullscreen', function() { fsBtn.textContent = '✕'; });
video.addEventListener('webkitendfullscreen', function() { fsBtn.textContent = '⛶'; });

// Оверлеї запускаються після 2 хв перегляду — через showPreroll → scheduleOverlay

// Scroll active channel into view on load
(function(){
  const active = document.querySelector('.ch-item-s.active');
  if (active) active.scrollIntoView({block:'center', behavior:'auto'});
})();

// Sidebar search
const chSearch = document.getElementById('ch-search');
if (chSearch) {
  chSearch.addEventListener('input', function() {
    const q = this.value.toLowerCase();
    document.querySelectorAll('.cat-group-s').forEach(group => {
      let hasVisible = false;
      group.querySelectorAll('.ch-item-s').forEach(el => {
        const show = !q || el.dataset.name.toLowerCase().includes(q);
        el.style.display = show ? '' : 'none';
        if (show) hasVisible = true;
      });
      const label = group.previousElementSibling;
      if (label && label.classList.contains('cat-label-s')) {
        label.style.display = hasVisible ? '' : 'none';
      }
      group.style.display = hasVisible ? '' : 'none';
    });
  });
}
